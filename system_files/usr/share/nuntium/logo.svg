<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27253D" />
      <stop offset="100%" stop-color="#171626" />
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A799FF" />
      <stop offset="50%" stop-color="#7F77DD" />
      <stop offset="100%" stop-color="#58B7FF" />
    </linearGradient>
    <linearGradient id="leftLeg" x1="15%" y1="100%" x2="75%" y2="10%">
      <stop offset="0%" stop-color="#1B1E54" />
      <stop offset="48%" stop-color="#3C4AE0" />
      <stop offset="100%" stop-color="#7F6BFF" />
    </linearGradient>
    <linearGradient id="rightLeg" x1="20%" y1="100%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="#5935E8" />
      <stop offset="55%" stop-color="#3B42B8" />
      <stop offset="100%" stop-color="#795BFF" />
    </linearGradient>
    <linearGradient id="diagRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2C2FF" />
      <stop offset="42%" stop-color="#8B6EFF" />
      <stop offset="100%" stop-color="#6B3DFF" />
    </linearGradient>
    <linearGradient id="cyanRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4AD4FF" />
      <stop offset="50%" stop-color="#9A7BFF" />
      <stop offset="100%" stop-color="#D4BFFF" />
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="3" />

  <g filter="url(#softGlow)">
    
    <path d="M31 93 C28 91, 35 55, 42 36 C47 26, 61 27, 63 39 L53 71 C49 84, 38 97, 31 93 Z" fill="url(#leftLeg)" stroke="url(#cyanRim)" stroke-width="1.6" />
    
    <path d="M68 89 C67 76, 75 46, 86 33 C92 27, 100 28, 99 35 C97 49, 90 77, 82 91 C78 97, 69 96, 68 89 Z" fill="url(#rightLeg)" stroke="url(#cyanRim)" stroke-width="1.6" />
    
    <path d="M40 43 C44 26, 60 25, 66 39 L86 78 C91 88, 82 99, 72 95 C66 93, 62 87, 58 79 L44 50 C42 46, 39 46, 40 43 Z" fill="url(#diagRibbon)" fill-opacity="0.9" stroke="#CBB9FF" stroke-width="1.2" />
  </g>
</svg>