      <stop offset="55%" stop-color="#4A42B5" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#12121D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pLeftLeg" x1="15%" y1="100%" x2="75%" y2="10%">
      <stop offset="0%" stop-color="#171B4D" />
