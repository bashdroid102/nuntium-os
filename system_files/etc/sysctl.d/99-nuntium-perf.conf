# Оптимизация памяти под ZRAM (8 ГБ ОЗУ) и отзывчивости интерфейса
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Снижение лишних пробуждений CPU для автономности ноутбука
kernel.nmi_watchdog = 0